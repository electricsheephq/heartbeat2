id: hermes-drained
title: A queued owner message is answered after the silent wake finishes
cites:
- 'Hermes: drained human input reaches only pre_llm_call (no dispatch, no admission)'
settings: {}
arms:
- ref: task
  args:
    note: Follow up until the owner replies.
    trigger:
      kind: at
      at: in 5m
    until:
      owner_replies: true
- ref: pending_reply
  args:
    note: Wait until later unless the owner replies.
    trigger:
      kind: at
      at: in 2h
    until:
      owner_replies: true
timeline: []
model_policy:
  task:
  - outcome: progress
    notify: false
    summary: Waiting.
    drained_human: Any update?
    raw: Here is the update you requested.
    human_raw: Here is your requested update.
duration: 1200
expectations:
  required_fires:
  - wake: task
    window:
    - 300
    - 330
  forbidden_deliveries: []
  bars:
    task:
      deliveries: 0
      status: done
      model_wakes: 1
      prompted_deliveries: 1
    pending_reply:
      deliveries: 0
      model_wakes: 0
      status: cancelled
heartbeat_checklist:
- ref: task
  session: owner
  note: Follow up until the owner replies.
baseline_interval_s: 300
