id: caps-owner-bypass
title: Saturated daily messages preserve owner classes and hold watcher until the
  next local day
cites:
- 'B1 realism: Saturated daily messages preserve owner classes and hold watcher until
  the next local day'
settings:
  max_unanswered: 10
arms:
- ref: owner
  command: add in 1m Owner reminder
- ref: requested
  args: &id001
    note: Report useful news for requested
    trigger:
      kind: at
      at: in 12m
    owner_asked: true
  owner_turn: true
- ref: timer
  args:
    note: Report useful news for timer
    trigger:
      kind: at
      at: in 23m
- ref: watcher
  args:
    note: Report useful news for watcher
    trigger:
      kind: file
      path: $HOME/build.log
      pattern: MATCH
      check_every: 1m
- ref: model-owner
  command: add in 1m Owner reminder
  session: model-capped
- ref: model-requested
  args: *id001
  owner_turn: true
  session: model-capped
timeline:
- t: 0
  event: ledger
  ref: owner
  counts:
    delivered: 6
- t: 0
  event: ledger
  ref: model-owner
  counts:
    model_turns: 24
    delivered: 6
- t: 0
  event: file
  text: 'pending

    '
- t: 1800
  event: file
  text: 'MATCH

    '
- t: 3600
  event: session_state
  values:
    unanswered_count: 0
model_policy:
  default:
  - outcome: done
    notify: true
    summary: Complete.
duration: 44000
expectations:
  required_fires:
  - wake: owner
    window:
    - 60
    - 75
  - wake: requested
    window:
    - 720
    - 735
  - wake: watcher
    window:
    - 43200
    - 43215
  - wake: model-owner
    window:
    - 60
    - 75
  - wake: model-requested
    window:
    - 720
    - 735
  forbidden_deliveries: []
  bars:
    owner:
      deliveries: 1
      model_wakes: 1
      status: done
      wake_fields: {}
    requested:
      deliveries: 1
      model_wakes: 1
      status: done
      wake_fields:
        owner_requested: true
    timer:
      deliveries: 0
      model_wakes: 0
      status: failed
      wake_fields:
        status_reason: skipped:daily_message_cap
    watcher:
      deliveries: 1
      model_wakes: 1
      status: done
      wake_fields: {}
    model-owner:
      deliveries: 1
      model_wakes: 1
      status: done
      wake_fields: {}
    model-requested:
      deliveries: 1
      model_wakes: 1
      status: done
      wake_fields:
        owner_requested: true
  observations:
  - event: gate
    ref: timer
    reason: daily_message_cap
    window:
    - 1380
    - 1380
  - event: gate
    ref: watcher
    reason: held_daily_cap
    window:
    - 1800
    - 1800
heartbeat_checklist:
- ref: owner
  session: owner
  note: add in 1m Owner reminder
- ref: requested
  session: owner
  note: Report useful news for requested
- ref: timer
  session: owner
  note: Report useful news for timer
- ref: watcher
  session: owner
  note: Report useful news for watcher
- ref: model-owner
  session: model-capped
  note: add in 1m Owner reminder
- ref: model-requested
  session: model-capped
  note: Report useful news for requested
baseline_interval_s: 1800
sessions:
- name: owner
- name: model-capped
